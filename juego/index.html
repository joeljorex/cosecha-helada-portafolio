<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosecha Helada · Prototipo del Nivel 1</title>
  <meta name="description" content="Prototipo jugable del Nivel 1 de Cosecha Helada, juego de plataformas 2D hecho con Phaser 3.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='3' y='2' width='4' height='3' fill='%234f9a33'/%3E%3Crect x='8' y='2' width='2' height='3' fill='%23e2412f'/%3E%3Crect x='10' y='3' width='3' height='2' fill='%23ff9a3c'/%3E%3Crect x='2' y='5' width='12' height='9' fill='%23b0713a'/%3E%3Crect x='2' y='9' width='12' height='1' fill='%237f4f26'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="juego"></div>

  <!-- Controles táctiles: solo aparecen en celulares y tabletas -->
  <div id="tactil">
    <div class="grupo izquierda">
      <button data-k="izq" aria-label="Izquierda">◀</button>
      <button data-k="der" aria-label="Derecha">▶</button>
      <button data-k="abajo" aria-label="Deslizarse">▼</button>
    </div>
    <div class="grupo derecha">
      <button data-k="cambiar" aria-label="Cambiar arma">⇄</button>
      <button data-k="disparar" aria-label="Disparar">💧</button>
      <button data-k="saltar" aria-label="Saltar">⤒</button>
    </div>
    <div class="arriba">
      <button data-k="pausa" aria-label="Pausa">⏸</button>
      <button id="btn-sonido" aria-label="Sonido">🔊</button>
    </div>
  </div>

  <noscript><p class="error">Este juego necesita JavaScript.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/arte.js"></script>
  <script src="js/nivel1.js"></script>
  <script src="js/escenas.js"></script>
  <script src="js/juego.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
